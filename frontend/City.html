<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>City Map – New Vendetta</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Player Stats Bar -->
    <section class="nv-stats-bar">
        <div class="nv-stat">💰 $12,500</div>
        <div class="nv-stat">⚡ 80/100</div>
        <div class="nv-stat">❤️ 100%</div>
        <div class="nv-stat">🎖 Rank: Rookie</div>
    </section>

    <!-- City Map -->
    <section class="nv-city-container">
        <h2 class="nv-city-title">City Districts</h2>

        <div class="nv-city-grid">
            <div class="nv-city-block" onclick="window.location.href='casino.html'">Casino District</div>
            <div class="nv-city-block" onclick="window.location.href='hospital.html'">Hospital</div>
            <div class="nv-city-block" onclick="window.location.href='bank.html'">Bank</div>
            <div class="nv-city-block" onclick="window.location.href='gunshop.html'">Gun Shop</div>
            <div class="nv-city-block" onclick="window.location.href='blackmarket.html'">Black Market</div>
            <div class="nv-city-block" onclick="window.location.href='gym.html'">Gym</div>
            <div class="nv-city-block" onclick="window.location.href='carshop.html'">Car Dealer</div>
            <div class="nv-city-block" onclick="window.location.href='missions.html'">Mission HQ</div>
        </div>
    </section>

</body>
</html>
