<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up – New Vendetta</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <section class="nv-login-container">
        <h2 class="nv-login-title">NEW RECRUIT REGISTRATION</h2>

        <form class="nv-login-box">
            <input type="text" placeholder="Choose a Username" class="nv-input">
            <input type="password" placeholder="Create Password" class="nv-input">
            <input type="password" placeholder="Confirm Password" class="nv-input">
            <button type="submit" class="nv-login-btn">CREATE ACCOUNT</button>
        </form>

        <p class="nv-login-warning">All recruits are monitored.</p>

        <p class="nv-signup-text">
            Already have access? <a href="login.html" class="nv-signup-link">Return to Login</a>
        </p>
    </section>

</body>
</html>
