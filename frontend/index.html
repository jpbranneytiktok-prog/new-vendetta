<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>New Vendetta</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Header -->
    <header class="nv-header">
        <h1 class="nv-logo">NEW VENDETTA</h1>
    </header>

    <!-- Hero Section -->
    <section class="nv-hero">
        <h2 class="nv-tagline">Access the Underworld Network</h2>
    </section><button class="nv-enter-btn" onclick="window.location.href='login.html'">ENTER</button>

    <!-- Operations Section -->
    <section class="nv-operations">
        <h3>Operations</h3>
        <div class="nv-op-grid">
            <div class="nv-op-card">Chatrooms</div>
            <div class="nv-op-card">Leaderboard</div>
            <div class="nv-op-card">Territory</div>
            <div class="nv-op-card">Members</div>
        </div>
    </section>

    <!-- Territory Section -->
    <section class="nv-territory">
        <h3>Territory Control</h3>
        <p>Track influence, alliances, and rival factions.</p>
    </section>

    <!-- Footer -->
    <footer class="nv-footer">
        <p>New Vendetta © 2026</p>
    </footer>

</body>
</html>
