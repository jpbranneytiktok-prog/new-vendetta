
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login – New Vendetta</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <section class="nv-login-container">
        <h2 class="nv-login-title">UNDERWORLD ACCESS</h2>

        <div class="nv-login-box">
            <input type="text" placeholder="Username" class="nv-input">
            <input type="password" placeholder="Password" class="nv-input">

        <button type="button" onclick="window.location.href='Hub.html'" class="nv-login-btn">Login</button>

        <p class="nv-login-warning">Unauthorized access will be traced.</p>
    </section>
    <p class="nv-signup-text">
    No account? <a href="signup.html" class="nv-signup-link">Create one</a>
</p>
</body>
