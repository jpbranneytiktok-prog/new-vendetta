<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Roulette – New Vendetta</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Player Stats Bar -->
    <section class="nv-stats-bar">
        <div class="nv-stat">💰 $12,500</div>
        <div class="nv-stat">⚡ 80/100</div>
        <div class="nv-stat">❤️ 100%</div>
        <div class="nv-stat">🎖 Rank: Rookie</div>
    </section>

    <section class="nv-roulette-container">
        <h2 class="nv-roulette-title">Roulette Table</h2>

        <div class="nv-roulette-result" id="rouletteResult">
            Spin the wheel to begin.
        </div>

        <div class="nv-roulette-grid">
            <button class="nv-roulette-btn red">Red</button>
            <button class="nv-roulette-btn black">Black</button>
            <button class="nv-roulette-btn">Odd</button>
            <button class="nv-roulette-btn">Even</button>
            <button class="nv-roulette-btn">1 – 18</button>
            <button class="nv-roulette-btn">19 – 36</button>
            <button class="nv-roulette-btn green">0</button>
        </div>

        <button class="nv-spin-btn">SPIN</button>
    </section>

</body>
</html>
